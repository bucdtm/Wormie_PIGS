<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wormie · Panel del empleado</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211d;--mute:#5d6b66;--line:#dfe5e2;--acc:#1f6f5c;--on:#fff;--acc2:#c9a24b;--warn:#a8402f;--ok:#1f6f5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1412;--card:#16201d;--ink:#e8efec;--mute:#93a39c;--line:#26342f;--acc:#4fb79c;--on:#0d1412;--acc2:#d8b45c;--warn:#e28a78;--ok:#4fb79c}}
:root[data-theme="dark"]{--bg:#0d1412;--card:#16201d;--ink:#e8efec;--mute:#93a39c;--line:#26342f;--acc:#4fb79c;--on:#0d1412;--acc2:#d8b45c;--warn:#e28a78;--ok:#4fb79c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#05090a;color:#e8efec}
.bar{max-width:1140px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:600 26px Fraunces,serif;color:#bff4fb;text-shadow:0 0 12px #3ad1e5aa}
.brand img{height:54px;mix-blend-mode:screen}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{background:none;border:0;color:#9fb3ad;padding:8px 13px;border-radius:99px;font-weight:500;white-space:nowrap}
nav button[aria-current=true]{background:#e8efec;color:#05090a}
nav b{background:var(--acc2);color:#16211d;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
.who{font-size:13px;color:#9fb3ad;display:flex;align-items:center;gap:10px}
.who .btn{background:none;border:1px solid #2c3d38;color:#e8efec}
.wrap{max-width:1140px;margin:0 auto;padding:30px 20px 64px}
.sec-h{margin-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(28px,4vw,40px)}.sec-h p{color:var(--mute);margin:6px 0 0;max-width:60ch}
.banner{background:#000;border-radius:18px;display:flex;align-items:center;gap:24px;padding:16px 28px;margin-bottom:24px;flex-wrap:wrap;color:#e8efec}
.banner img{height:150px;mix-blend-mode:screen}
.banner h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin-bottom:6px}.banner p{margin:0;color:#9fb3ad;max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{font:600 34px Fraunces,serif;display:block}.stat span{color:var(--mute);font-size:14px}
.stat.hot b{color:var(--warn)}
h3.sub{font-size:22px;margin:26px 0 12px}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.row .main{flex:1;min-width:210px}.row .main b{font:600 18px Fraunces,serif}.row .main div{color:var(--mute);font-size:14px}
.mini{width:44px;height:64px;border-radius:3px 6px 6px 3px;flex:none;background-size:cover;background-position:center}
.dates{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.dates b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.pill{font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.wait{background:color-mix(in srgb,var(--acc2) 24%,transparent);color:var(--ink)}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-block}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:0;text-decoration:underline}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.search input{flex:1;border:0;background:none;color:var(--ink);padding:13px 0;outline:0}.search:focus-within{border-color:var(--acc)}
select,input[type=number]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
.book{display:flex;flex-direction:column}
.cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;padding:18px 16px 18px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);background-size:cover;background-position:center}
.cover::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28)}
.cover.img{padding:0}.cover.img::before{display:none}
.cover h4{font-size:20px;line-height:1.15}.cover small,.cover em{font:normal 12px Manrope;opacity:.85}
.info{padding:12px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.info h4{font-size:17px;line-height:1.25}.info .au{color:var(--mute);font-size:14px}
.meta{font-size:13px;color:var(--mute);display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:6px 0}
.stock{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.stock span{font-weight:600;font-size:13px}.stock div{display:flex;align-items:center;gap:6px}
.stock button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink)}
.up{margin-top:10px;font-size:13px;text-align:center;cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mute);font-weight:500}
.scroll{overflow-x:auto}
.empty{padding:44px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:26px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{font-size:24px;margin-bottom:6px}dialog p{color:var(--mute);margin:0 0 14px}
dialog label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
dialog input,dialog select{width:100%}dialog input[type=range]{accent-color:var(--acc)}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
section[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:#05090a;color:#e8efec;display:flex;flex-direction:column;gap:22px;padding:18px 14px;overflow-y:auto}
.side .brand{padding:0 6px}.side .brand img{height:64px}
.side nav{flex-direction:column;overflow:visible;flex:1;gap:4px}
.side nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:12px;padding:11px 14px}
.side nav b{margin-left:auto}
.side .who{flex-direction:column;align-items:stretch;gap:10px;padding:0 6px}
.wrap{margin:0 auto;width:100%}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 14px;gap:8px 12px}
.side .brand img{height:44px}.side nav{flex-direction:row;overflow-x:auto;order:3;width:100%;flex:none}
.side nav button{padding:8px 13px;white-space:nowrap}.side nav b{margin-left:6px}
.side .who{flex-direction:row;align-items:center;margin-left:auto}.side .who span{display:none}}
</style>
</head>

 modal(`<h3>Devolución con retraso</h3><p>${u.n} devuelve «${b.t}» con ${d} días de retraso. Indica la sanción.</p><label for="sm">Motivo</label><input id="sm" value="Devolución con ${d} días de retraso"><label for="sg">Gravedad</label><select id="sg"><option>Leve</option><option>Media</option><option>Grave</option></select><label for="sa">Monto (€)</label><input id="sa" type="number" min="0" step="0.5" value="${(d*.5).toFixed(2)}"><div class="acts">${cancel}<button class="btn" data-rc="${id}">Registrar y sancionar</button></div>`)}
function hist(id){const u=us(id),h=P.filter(p=>p.u===id).sort((a,b)=>b.p.localeCompare(a.p));
 modal(`<h3>${u.n}</h3><p>${u.no} · Alta ${fmt(u.alta)} · ${nS(id)} sanciones</p>${h.length?h.map(p=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${bk(p.b).t}</b><div style="font-size:13px;color:var(--mute)">Prestado ${fmt(p.p)} · Prevista ${fmt(p.v)} · ${p.r?'Devuelto '+fmt(p.r)+(p.r>p.v?' (tarde)':' a tiempo'):'Sigue en su poder'}</div></div>`).join(''):'<p>Sin préstamos todavía.</p>'}<div class="acts"><button class="btn" data-close>Cerrar</button></div>`)}
let upId=null;
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.s)go(d.s);if('close' in d)dlg.close();
 if(d.g)grant(+d.g);if(d.h)hist(+d.h);if(d.rt)ret(+d.rt);
 if(d.x){R=R.filter(r=>r.id!==+d.x);toast('Reserva rechazada.');render()}
 if(d.gc){const r=R.find(x=>x.id===+d.gc),n=+$('days').value;P.push({id:++nid,u:r.u,b:r.b,p:today,v:dd(n),r:null});bk(r.b).n--;R=R.filter(x=>x!==r);dlg.close();toast('Reserva concedida por '+n+' días.');render()}
 if(d.rc){const p=P.find(x=>x.id===+d.rc);p.r=today;bk(p.b).n++;X.push({id:++nid,u:p.u,b:p.b,m:$('sm').value||'Devolución tardía',g:$('sg').value,amt:+$('sa').value||0,paid:false});dlg.close();toast('Devolución registrada y sanción creada.');render()}
 if(d.p){X.find(x=>x.id===+d.p).paid=true;toast('Sanción marcada como pagada.');render()}
 if(d.st){const[i,n]=d.st.split(':').map(Number);B[i].n=Math.max(0,B[i].n+n);const a=q;render()}
 if(d.up){upId=+d.up;$('file').click()}});
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=360,c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);B[upId].img=c.toDataURL('image/jpeg',.82);
 try{const o={};B.forEach(b=>{if(b.img)o[b.id]=b.img});localStorage.setItem('wormie-covers',JSON.stringify(o))}catch(x){}toast('Portada actualizada.');e.target.value='';render()};im.src=URL.createObjectURL(f)};
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;grid()}});
document.addEventListener('change',e=>{if(e.target.id==='fd'){fd=e.target.value;grid()}});
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
render();
</script>
</body>
</html>
